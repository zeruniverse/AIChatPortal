services:
  chat-app:
    build: .
    container_name: openai-compatible-chat-app
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CONFIG_PATH: /app/config.json
      CHAT_DIR: /app/chat
    volumes:
      - ./config.json:/app/config.json:ro
      - ./chat:/app/chat
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
